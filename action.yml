name: Close on Labels
description: Close issues and pull requests when their labels match a rule (OR / AND / NOT expressions, inline or from a file).
author: dwertent
branding:
  icon: x-circle
  color: red

inputs:
  labels:
    description: Inline list of labels, separated by commas or newlines. Combined with `operator`.
    required: false
    default: ""
  operator:
    description: How the inline `labels` are combined. `OR` (any label) or `AND` (all labels).
    required: false
    default: OR
  expression:
    description: >-
      Inline label expression, e.g. `wontfix OR (duplicate AND NOT keep-open)`.
      Cannot be used together with `labels`.
    required: false
    default: ""
  rules-file:
    description: Path to a YAML file with rules, e.g. `.github/close-rules.yml`.
    required: false
    default: ""
  target:
    description: What may be closed. `issues`, `prs` or `all`. Default for rules that do not set their own.
    required: false
    default: all
  comment:
    description: >-
      Comment to post before closing. Supports `{{matched}}` and `{{rule}}`.
      Default for rules that do not set their own. Empty means no comment.
    required: false
    default: ""
  close-reason:
    description: Close reason for issues. `completed` or `not_planned`. Ignored for pull requests.
    required: false
    default: not_planned
  lock:
    description: Lock the conversation after closing.
    required: false
    default: "false"
  dry-run:
    description: Log what would be closed without closing, commenting or locking.
    required: false
    default: "false"
  number:
    description: Issue or pull request number. Defaults to the one from the triggering event.
    required: false
    default: ""
  token:
    description: Token used to read labels and close. Needs `issues: write` and `pull-requests: write`.
    required: false
    default: ${{ github.token }}

outputs:
  closed:
    description: "`true` if the issue or pull request was closed by this run."
  matched-rule:
    description: Name of the rule that matched. Empty if none. Set in dry-run too.
  matched-labels:
    description: Comma separated labels that made the rule match.
  number:
    description: The issue or pull request number that was checked.

runs:
  using: node24
  main: dist/index.js
