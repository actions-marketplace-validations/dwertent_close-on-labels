name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The e2e workflow's throwaway pull request only adds a marker file.
    paths-ignore: ["e2e/marker-*.txt"]

permissions:
  contents: read

jobs:
  test:
    # The e2e workflow opens a throwaway pull request from an e2e/ branch. Skip it.
    if: "!startsWith(github.head_ref, 'e2e/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check that dist/ is up to date
        run: |
          if ! git diff --exit-code --stat -- dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
