name: Release

# Pushing a tag like v1.2.3 moves the major tag (v1) to it, so that
# `uses: dwertent/close-on-labels@v1` picks up the new version.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Move major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "Moved $major to $GITHUB_REF_NAME ($GITHUB_SHA)"
